services:
  nexus-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus-life-os-dev
    ports:
      - "3001:3001"
      - "5173:5173"
    environment:
      - PORT=3001
      - NOTES_DIR=/app/notes
      - NODE_ENV=development
    volumes:
      - ./notes:/app/notes
      - ./server:/app/server
      - ./client:/app/client
      - /app/server/node_modules
      - /app/client/node_modules
    command: npm run dev
